<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Loja</title>
    <link rel="stylesheet" href="css/pages/PaginaLoja.css">
</head>



<body>

    <div id="mensagensTopo">
        <div id="msgPaginaLoja" class="toast"></div>
    </div>

    <button id="btn-cotacao" class="btn-cotacao-flutuante">
        Cotação
    </button>

    <div id="app-header"></div>
    
    <section id="vitrineLoja"></section>

    <div id="modal-cotacao" class="modal-cotacao">
        <div class="modal-cotacao-content">

            <button id="fechar-modal-cotacao" class="fechar-modal">✕</button>

            <h2>Cotação</h2>

            <div class="resumo-produtos">

                <div class="produto-resumo">
                    <img id="foto-lente" src="imgs/store1.png">
                    <div id="Lente"></div>
                </div>

                <div class="produto-resumo">
                    <img id="foto-armacao" src="imgs/store1.png">
                    <div id="Armacao"></div>
                </div>

            </div>

            <form id="form-cotacao">
                <div class="cotacao-scroll">

                <p class="cotacao-ajuda">
                    Preencha somente os campos que aparecem na sua receita. Se não souber, anexe a receita ou explique nas observações.
                </p>

                <p id="solicitacao-como" class="cotacao-usuario-logado"></p>

                <div class="cotacao-grid">
                    <label>
                        Esférico OE
                        <input id="esferico-esq" type="number" step="0.25" placeholder="Ex: -1.50">
                    </label>

                    <label>
                        Esférico OD
                        <input id="esferico-dir" type="number" step="0.25" placeholder="Ex: -1.25">
                    </label>

                    <label>
                        Cilíndrico OE
                        <input id="cilindrico-esq" type="number" step="0.25" placeholder="Ex: -0.75">
                    </label>

                    <label>
                        Cilíndrico OD
                        <input id="cilindrico-dir" type="number" step="0.25" placeholder="Ex: -0.50">
                    </label>

                    <label>
                        Eixo OE
                        <input id="eixo-esq" type="number" step="1" min="0" max="180" placeholder="0 a 180">
                    </label>

                    <label>
                        Eixo OD
                        <input id="eixo-dir" type="number" step="1" min="0" max="180" placeholder="0 a 180">
                    </label>

                    <label>
                        Adição para perto
                        <input id="adicao" type="number" step="0.25" min="0" placeholder="Opcional">
                    </label>

                    <label>
                        Tipo de lente desejado
                        <select id="tipo-lente-desejado">
                            <option value="">Selecione se souber</option>
                            <option value="MONOFOCAL">Monofocal</option>
                            <option value="MULTIFOCAL">Multifocal</option>
                            <option value="BIFOCAL">Bifocal</option>
                            <option value="OCUPACIONAL">Ocupacional</option>
                            <option value="DESCANSO">Descanso</option>
                            <option value="NAO_SEI_INFORMAR">Não sei informar</option>
                        </select>
                    </label>
                </div>

                <fieldset class="cotacao-tratamentos">
                    <legend>Tratamentos desejados</legend>
                    <label><input type="checkbox" name="tratamentos" value="ANTIRREFLEXO"> Antirreflexo</label>
                    <label><input type="checkbox" name="tratamentos" value="FILTRO_AZUL"> Filtro azul</label>
                    <label><input type="checkbox" name="tratamentos" value="FOTOSSENSIVEL"> Fotossensível</label>
                    <label><input type="checkbox" name="tratamentos" value="ANTIRRISCO"> Antirrisco</label>
                    <label><input type="checkbox" name="tratamentos" value="PROTECAO_UV"> Proteção UV</label>
                    <label><input type="checkbox" name="tratamentos" value="ALTO_INDICE"> Alto índice</label>
                    <label><input type="checkbox" name="tratamentos" value="POLICARBONATO"> Policarbonato</label>
                    <label><input type="checkbox" name="tratamentos" value="OUTRO"> Outro</label>
                </fieldset>

                <label>
                    Anexar receita (PDF, PNG, JPG/JPEG)
                    <input id="receita-arquivo" type="file" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg">
                </label>

                <label>
                    Observações
                    <textarea id="observacoes-cotacao" maxlength="1000" placeholder="Explique qualquer detalhe importante para a ótica."></textarea>
                </label>

                <p class="cotacao-aviso">
                    A ótica analisará os dados enviados antes de confirmar preço e disponibilidade. O VisionPlus+ apenas intermedia a solicitação de cotação.
                </p>
                </div>

                <div class="cotacao-acoes">
                    <button type="submit" id="btn-enviar-cotacao" class="button">
                        Enviar cotação
                    </button>
                </div>
            </form>

        </div>
    </div>

    <div id="modal-produto" class="modal-produto">
        <div class="modal-produto-content">

            <button id="fechar-modal-produto">✕</button>

            <div class="produto-imagem-modal">
                <img id="produto-imagem" src="" alt="Produto">
            </div>

            <span id="produto-nome"></span>
            <span id="produto-tipo"></span>

            <div class="produto-info-linha">
                <div class="produto-info-item">
                    <label>Marca:</label>
                    <span id="produto-marca"></span>
                </div>

                <div class="produto-info-item">
                    <label>Modelo:</label>
                    <span id="produto-modelo"></span>
                </div>

                <div class="produto-info-item">
                    <label>Material:</label>
                    <span id="produto-material"></span>
                </div>
            </div>

            <span id="produto-descricao"></span>
            <span id="produto-preco"></span>

            <button id="btn-adicionar-cotacao">
                Adicionar à cotação
            </button>

        </div>
    </div>

</body>


<script type="module" src="JS/pages/PaginaLoja.js"></script>

</html>
